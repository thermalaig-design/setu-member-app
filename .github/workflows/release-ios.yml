name: Release iOS (App Store)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build-only (no Apple keys), signed-check (sign, no upload), testflight (sign and upload)
        type: choice
        options: [build-only, signed-check, testflight]
        default: build-only
      version:
        description: App version, must be higher than the live App Store version (e.g. 1.7)
        type: string
        default: ""
      then_appstore:
        description: After TestFlight, wait for approval and then submit to App Review
        type: boolean
        default: false
      release_notes:
        description: What's New text (needed if then_appstore is ticked)
        type: string
        default: ""
      release_type:
        description: "After Apple approval: manual button or automatic release"
        type: choice
        options: [manual, automatic]
        default: manual
      phased_release:
        description: Release to users gradually over 7 days
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    # On this job only, so a run waiting for approval does not block new builds.
    concurrency:
      group: release-ios
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.archive.outputs.build_number }}
    timeout-minutes: 45
    env:
      TEAM_ID: 26L6W22BA4
      MODE: ${{ inputs.mode || 'build-only' }}
      VERSION: ${{ inputs.version }}
      THEN_APPSTORE: ${{ inputs.then_appstore }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Validate inputs
        run: |
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::version must look like 1.7 or 1.7.1, got '$VERSION'"; exit 1
          fi
          if [ "$MODE" = "testflight" ] && [ -z "$VERSION" ]; then
            echo "::error::version is required for testflight"; exit 1
          fi
          if [ "$THEN_APPSTORE" = "true" ]; then
            [ "$MODE" = "testflight" ] || { echo "::error::then_appstore needs mode testflight"; exit 1; }
            [ -n "${RELEASE_NOTES// /}" ] || { echo "::error::release_notes is required with then_appstore"; exit 1; }
            [ "$GITHUB_REF" = "refs/heads/develop" ] || { echo "::error::then_appstore is allowed only from develop"; exit 1; }
          fi
          echo "Mode: $MODE"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      # @capawesome/capacitor-app-update 7.x asks for capacitor-swift-pm 7, which
      # conflicts with Capacitor 8. Its iOS source is the same as 8.x.
      - name: Patch app-update plugin for Capacitor 8
        run: |
          file=node_modules/@capawesome/capacitor-app-update/Package.swift
          sed -i '' -e 's/from: "7\.0\.0"/from: "8.0.0"/' -e 's/\.iOS(\.v14)/.iOS(.v15)/' "$file"
          grep -q 'from: "8.0.0"' "$file" || { echo "::error::app-update plugin patch did not apply"; exit 1; }

      - name: Write .env from APP_ENV
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          [ -n "$APP_ENV" ] || { echo "::error::APP_ENV secret missing"; exit 1; }
          printf '%s\n' "$APP_ENV" > .env
          chmod 600 .env
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_BASE_URL; do
            grep -Eq "^[[:space:]]*(export[[:space:]]+)?${name}=.+" .env || { echo "::error::APP_ENV is missing $name"; exit 1; }
          done
          grep -Eq "^[[:space:]]*(export[[:space:]]+)?VITE_ENABLE_FCM_PUSH=[\"']?true" .env \
            || echo "::warning::VITE_ENABLE_FCM_PUSH is not true in APP_ENV; push notifications may be off in this build"

      - name: Build web assets and sync Capacitor
        run: |
          npm run build:capacitor
          npx cap sync ios

      # The archive is built unsigned so that CI does not create a new
      # development certificate on every run. Signing happens at export.
      - name: Archive
        id: archive
        run: |
          extra=()
          [ -n "$VERSION" ] && extra+=("MARKETING_VERSION=$VERSION")
          build_number="$((100 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION:-from project} build=$build_number"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$build_number" \
            ${extra[@]+"${extra[@]}"} \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: Signing|ARCHIVE" || {
              tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }
          [ -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" ] || { echo "::error::Archive has no App.app"; exit 1; }

      # An unsigned archive carries no entitlements, so add them (ad-hoc) before
      # export. Without this the push notification entitlement would be lost.
      - name: Add entitlements to the archive
        if: env.MODE != 'build-only'
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          ent="$RUNNER_TEMP/release.entitlements"
          cp ios/App/App/App.entitlements "$ent"
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ent"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' item; do codesign --force --sign - "$item"; done
          fi
          codesign --force --sign - --entitlements "$ent" --generate-entitlement-der "$app"

      - name: Prepare App Store Connect key
        if: env.MODE != 'build-only'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::$name secret missing"; exit 1; }
          done
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8")

      - name: Sign and export IPA
        if: env.MODE != 'build-only'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for destination in export upload; do
            plist="$RUNNER_TEMP/ExportOptions-$destination.plist"
            cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          done

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify signed IPA
        if: env.MODE != 'build-only'
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "::error::No IPA produced"; exit 1; }
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier)="
          codesign -d --entitlements "$RUNNER_TEMP/signed.entitlements" --xml "$app"
          aps=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/signed.entitlements" || true)
          echo "aps-environment: ${aps:-missing}"
          [ "$aps" = "production" ] || { echo "::error::Push entitlement is not 'production'; refusing to upload"; exit 1; }

      - name: Upload to TestFlight
        if: env.MODE == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cleanup secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" .env

  # Waits here until a reviewer has tested the build on TestFlight and approves.
  approval:
    name: Test ${{ inputs.version }} (${{ needs.release.outputs.build_number }}) then approve
    needs: release
    if: inputs.mode == 'testflight' && inputs.then_appstore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: app-store-approval
    permissions:
      actions: read
    steps:
      # Without a required reviewer this job would pass on its own, so stop then.
      - name: Make sure a reviewer is required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/environments/app-store-approval" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          [ "$count" -ge 1 ] || { echo "::error::Add Required reviewers to the app-store-approval environment"; exit 1; }
          echo "Approved"

  appstore:
    needs: [release, approval]
    uses: ./.github/workflows/release-ios-appstore.yml
    with:
      action: submit
      version: ${{ inputs.version }}
      build_number: ${{ needs.release.outputs.build_number }}
      release_notes: ${{ inputs.release_notes }}
      release_type: ${{ inputs.release_type }}
      phased_release: ${{ inputs.phased_release }}
    secrets: inherit